name: GNOME Extension CI

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - "gnome-extension/**"
      - ".github/workflows/gnome-extension-zip.yml"
  workflow_dispatch:

jobs:

  zip:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # EGO-style package: extension files (metadata.json, …) at the zip root
      - name: Create extension zip
        run: |
          cd gnome-extension/hikup@hikari03
          zip -r "../../hikup@hikari03.zip" .

      # pinned Shexli via the action — the latest PyPI release can segfault
      - name: Verify extension zip
        uses: stuarthayhurst/shexli-github-action@v1
        with:
          path: "hikup@hikari03.zip"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikup@hikari03
          path: hikup@hikari03.zip
          if-no-files-found: error
